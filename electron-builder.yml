appId: com.clipless.app
productName: Clipless
directories:
  buildResources: build
  output: dist
icon: build/icon.icns
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
win:
  executableName: clipless
  icon: build/icon.ico
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  icon: build/icon.icns
  category: public.app-category.productivity
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  extendInfo:
    NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    NSHumanReadableCopyright: Copyright © 2025 Daniel Essig
    CFBundleIconFile: icon.icns
    CFBundleIconName: icon
  # Skip code signing and entitlements for unsigned builds
  identity: null
  entitlements: null
  entitlementsInherit: null
  gatekeeperAssess: false
  notarize: false
  # Force icon embedding
  type: distribution
  bundleVersion: ${version}
dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
  title: ${productName} ${version}
  icon: build/icon.icns
  iconSize: 80
  window:
    width: 540
    height: 380
    x: 400
    y: 100
  contents:
    - x: 130
      y: 220
      type: file
    - x: 410
      y: 220
      type: link
      path: /Applications
  background: null
  format: UDZO
  internetEnabled: false
linux:
  # snap is deliberately not built. electron-builder's snap template pins
  # base: core20 with the gnome-3-28-1804 platform, whose Mesa is 20.0.8 (2020).
  # On current GPUs every DRI driver in it fails to load — including swrast — so
  # the app segfaults during GPU init and no runtime flag avoids it. Reviving the
  # snap means base: core24 with gnome-46-2404 and the mesa-2404 content snap,
  # which builds through the real snapcraft toolchain rather than the template.
  target:
    - AppImage
    - deb
  maintainer: electronjs.org
  category: Utility
  # Must be a directory of standard hicolor sizes. A single 1024x1024 png installs
  # to hicolor/1024x1024/apps, which is not a directory declared in hicolor's
  # index.theme, so icon-theme lookup of `Icon=clipless` fails and the desktop
  # shows the generic fallback icon.
  icon: build/icons
appImage:
  artifactName: ${name}-${version}.${ext}
snap:
  # Inert while snap is off the target list, but keep it: electron-builder
  # defaults snap artifacts to the Snap Store, which needs snapcraft (and store
  # credentials) on the build machine. CI has neither, and the failed store
  # upload aborted the whole linux build *before* the updater metadata was
  # written — which is why v1.8.8 shipped an AppImage and a deb but no
  # latest-linux.yml. Re-adding the snap target without this would silently
  # break Linux auto-update again.
  publish:
    provider: github
    owner: dantheuber
    repo: clipless
    releaseType: draft
npmRebuild: false
publish:
  provider: github
  owner: dantheuber
  repo: clipless
  releaseType: draft
