# This workflow handles manual releases when tags are pushed directly
name: Manual Tag Release

on:
  push:
    tags: ['v*']

jobs:
  # Build and create draft release when tag is pushed manually
  build-and-release:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: mac

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Linux specific setup for AppImage, snap and deb
      # squashfs-tools provides mksquashfs, which electron-builder uses to pack
      # the snap; dpkg/fakeroot back the deb target.
      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3-dev libatk-bridge2.0-dev libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libxss1 squashfs-tools fakeroot

      - name: Build/release Electron app
        uses: samuelmeuli/action-electron-builder@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

          # Always create release for tags, but as draft
          release: true

          build_script_name: build
          max_attempts: 3
        env:
          # Skip macOS code signing and notarization for now
          CSC_IDENTITY_AUTO_DISCOVERY: false
          CSC_LINK: ''
          CSC_KEY_PASSWORD: ''

      # Kept out of the electron-builder run on purpose - see the matching step
      # in merge-to-main.yml for why a store failure must not fail the release.
      - name: Publish snap to the Snap Store
        if: matrix.platform == 'linux'
        continue-on-error: true
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          if [ -z "$SNAPCRAFT_STORE_CREDENTIALS" ]; then
            echo "SNAPCRAFT_STORE_CREDENTIALS is not set - skipping Snap Store upload."
            exit 0
          fi
          snap_count=$(ls -1 dist/*.snap 2>/dev/null | wc -l)
          if [ "$snap_count" -ne 1 ]; then
            echo "Expected exactly one snap in dist/, found $snap_count - skipping upload."
            exit 0
          fi
          snap_file=$(ls -1 dist/*.snap)
          sudo snap install snapcraft --classic
          echo "Uploading $snap_file to the edge channel"
          snapcraft upload "$snap_file" --release=edge
