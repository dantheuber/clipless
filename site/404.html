<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found — Clipless</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" href="/assets/icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('clipless-theme');
        var sys = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.dataset.theme = (saved === 'light' || saved === 'dark') ? saved : sys;
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    })();
  </script>
  <style>
    .nf {
      min-height: 100vh;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 40px 24px;
    }
    .nf .code {
      font-family: var(--font-mono);
      font-size: clamp(64px, 16vw, 140px);
      font-weight: 600;
      line-height: 1;
      background: var(--accent-grad);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .nf h1 { font-size: clamp(24px, 4vw, 36px); margin-top: 18px; }
    .nf p { color: var(--text-dim); margin-top: 14px; max-width: 420px; }
    .nf .hero-cta { justify-content: center; margin-top: 32px; }
  </style>
</head>
<body>
  <div class="bg-field"></div>
  <main class="nf">
    <div>
      <div class="code">404</div>
      <h1>This clip got cleared.</h1>
      <p>The page you're looking for isn't here. It may have moved, or never existed.</p>
      <div class="hero-cta">
        <a class="btn btn-primary btn-lg" href="/">Back to home</a>
        <a class="btn btn-ghost btn-lg" href="/docs/">Read the docs</a>
      </div>
    </div>
  </main>
</body>
</html>
